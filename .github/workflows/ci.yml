name: CI

# Nine stages. Eight do the work and run in parallel; the ninth aggregates them
# into the single status check that branch protection requires, so adding or
# renaming a job never means editing the protection rule.
#
# Dependency installation is a composite action rather than a job of its own —
# passing node_modules between jobs as an artifact costs more than restoring the
# npm cache in each one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Contract tests
        run: npm run test -w @crema/shared
      - name: Web tests
        run: npm run test:coverage -w @crema/frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Route and middleware tests
        run: npm run test:coverage -w @crema/backend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: backend/coverage
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: Database
    runs-on: ubuntu-latest

    # A real Postgres, matching the major version Supabase runs. Asserting
    # against the actual engine is the only way to know the SQL is correct —
    # constraints, generated columns, triggers and row level security all
    # behave in ways no amount of reading the file will confirm.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crema

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # An applied migration can never be edited, so the cheap checks have to
      # happen before the file is merged.
      - name: Lint migrations
        run: npm run lint:migrations

      - name: Apply migrations and seed
        run: npm run db:reset

      # Drift guard plus constraint assertions: proves the Drizzle definitions
      # still match the SQL, and that every CHECK actually rejects what it says
      # it does. A constraint nobody has seen fire is a comment with syntax.
      - name: Verify schema and constraints
        run: npm run test:db

  security:
    name: Security
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and later deleted is still
          # a leaked secret, and a shallow clone would not see it.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan full git history for secrets
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build every workspace
        run: npm run build
      - name: Check bundle budget
        run: npm run check:bundle

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright builds and serves both sides itself, so this exercises the
      # production output rather than a dev server.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # The single required check. Every job above must succeed for this to pass,
  # so branch protection points at this one name and never needs updating.
  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, unit, api, database, security, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any stage did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more stages failed. See the jobs above."
          exit 1
      - name: All stages passed
        run: echo "All nine stages green."
