name: Setup
description: Install Node from .nvmrc and project dependencies, with npm caching.

runs:
  using: composite
  steps:
    # node-version-file means CI and a developer's machine read the same pin.
    # There is no second place to update when the version moves.
    - name: Use Node from .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # `npm ci` rather than `npm install`: it installs exactly the lockfile and
    # fails if package.json and the lockfile disagree, which is a bug worth
    # finding in CI rather than in production.
    - name: Install dependencies
      shell: bash
      run: npm ci
